[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litscout"
version = "0.1.0"
description = "From a research question to a reading list, an outlook report and a question-answering knowledge base over the papers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.70",
  "requests>=2.31",
  "pypdf>=4.0",
]

[project.scripts]
litscout = "litscout.cli:main"

[tool.setuptools]
packages = ["litscout"]
